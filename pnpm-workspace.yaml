packages:
  - 'apps/*'
  - 'packages/*'

onlyBuiltDependencies:
  - '@prisma/engines'
  - '@prisma/client'
  - prisma
  - esbuild

# Versões compartilhadas: os package.json usam "catalog:" para não divergirem.
catalog:
  typescript: '^6.0.2'
  '@types/node': '^25.5.0'
  tsx: '^4.21.0'
  vitest: '^3.2.4'
  zod: '4.3.6'
  fastify: '5.8.4'
  fastify-type-provider-zod: '6.1.0'
  dayjs: '^1.11.21'
  dotenv: '^17.4.1'
